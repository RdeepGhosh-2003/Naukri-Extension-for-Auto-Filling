<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naukri SpeedFill Quick Search</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container" style="padding: 16px; width: 340px;">
    <!-- Header -->
    <header class="app-header" style="margin-bottom: 16px;">
      <div class="logo">
        <span class="icon">⚡</span>
        <h1>SpeedFill <span class="badge">Naukri</span></h1>
      </div>
      <button id="save-btn" class="btn btn-primary">Save Configuration</button>
    </header>

    <!-- Saved Quick Searches Section -->
    <div class="role-section-card" style="border-color: rgba(56,189,248,0.3); background: rgba(56,189,248,0.04);">
      <div class="role-section-header">
        <h3>🚀 Saved Quick Searches</h3>
      </div>
      <p class="tab-description" style="margin: 0 0 12px 0; font-size: 11px; color: var(--text-muted);">
        Each block appears as an option in the floating dropdown on Naukri for instant search navigation.
      </p>

      <!-- Dynamic search-block container (filled by popup.js) -->
      <div id="saved-searches-container"></div>

      <!-- Add New Search button -->
      <button id="add-search-btn" class="btn btn-secondary full-width" style="margin-top:10px; border-style:dashed; border-color:rgba(56,189,248,0.5); color:#38bdf8;">
        ➕ Add New Search
      </button>
    </div>

    <!-- Footer Toast -->
    <div id="toast" class="toast">Configuration Saved Successfully!</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
